# ============================================
# Codex Forge - Render Free Tier Config
# ============================================
# This file documents the Render configuration.
# Deploy manually via dashboard.render.com
#
# Free tier includes:
#   - 1 Web Service (750 hrs/month, spins down after 15min idle)
#   - 1 PostgreSQL (256MB, expires after 90 days)
#   - No Redis needed (task queue uses PostgreSQL polling)
#
# Build Command:  npm install && npm run render:build
# Start Command:  npm run render:start
# Health Check:   /api/health
# ============================================

services:
  - type: web
    name: codex-forge
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codex-forge-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: codex-forge-db
    plan: free
    databaseName: codex_forge
    user: codex_forge_user
    region: frankfurt
