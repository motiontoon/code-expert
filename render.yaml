# ============================================
# Codex Forge - Render Blueprint (IaC)
# Deploy: https://render.com/deploy
# ============================================

services:
  # ── Web Service (Backend + Frontend) ──────────
  - type: web
    name: codex-forge
    runtime: node
    region: frankfurt  # Change to your preferred region
    plan: starter      # starter = $7/mo, free = $0 (with limits)
    buildCommand: npm install && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: codex-forge-db
          property: connectionString
      - key: SERVER_URL
        sync: false  # Set after first deploy: https://codex-forge-xxxx.onrender.com
      - key: CLIENT_URL
        sync: false  # Same as SERVER_URL in production
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: GITHUB_CLIENT_ID
        sync: false  # Set manually from GitHub OAuth App
      - key: GITHUB_CLIENT_SECRET
        sync: false  # Set manually from GitHub OAuth App
      - key: GITHUB_CALLBACK_URL
        sync: false  # https://codex-forge-xxxx.onrender.com/api/auth/github/callback
      - key: ANTHROPIC_API_KEY
        sync: false  # Set manually
      - key: AI_MODEL
        value: claude-sonnet-4-5-20250929
      - key: FILE_GUARD_ENABLED
        value: "true"
      - key: FILE_GUARD_STRICT_MODE
        value: "true"
      - key: LOG_LEVEL
        value: info

  # ── Redis (for task queue) ────────────────────
  - type: redis
    name: codex-forge-redis
    plan: starter  # starter = $7/mo, free = $0
    ipAllowList: []

# ── PostgreSQL Database ─────────────────────────
databases:
  - name: codex-forge-db
    plan: starter    # starter = $7/mo, free = $0 (90-day limit)
    databaseName: codex_forge
    user: codex_forge_user
    region: frankfurt
